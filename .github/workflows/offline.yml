name: Offline artifact checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-offline.txt
      - run: python -m pip install -r requirements-offline.txt
      - run: python scripts/reproduce_archived_results.py all
      - run: python -m pytest tests -q
