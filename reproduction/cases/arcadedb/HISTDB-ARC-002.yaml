schema_version: 1
family_id: HISTDB-ARC-002
title: Correlated COUNT subquery ignores the outer variable
paper_set: fixed-version-50
dbms: arcadedb
symptom: every correlated count evaluates to zero
issue:
  url: https://github.com/ArcadeData/arcadedb/issues/4015
  status: confirmed
  report_path: issue_reports/submitted/arcadedb/2026-4-25/arcadedb_correlated_count_subquery_with_outer_variable_access_may_evaluate_as_zero.md
targets:
  buggy: {id: arcadedb-26.4.1}
  fixed: []
observation: {reported_version: 26.4.1-SNAPSHOT, execution_target: "arcadedata/arcadedb:26.4.1"}
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - "CREATE (:Person {name:'Alice', age:30}), (:Person {name:'Bob', age:25}), (:Person {name:'Charlie', age:35}), (:Person {name:'Diana', age:40})"
  query: |-
    MATCH (p:Person)
    WHERE p.age > 25
    RETURN p.name AS name,
           COUNT {
             MATCH (p2:Person)
             WHERE p2.age > p.age
             RETURN p2
           } AS older_count
    ORDER BY name
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: exact_rows
  ordered: true
  expected_buggy:
    - {name: Alice, older_count: 0}
    - {name: Charlie, older_count: 0}
    - {name: Diana, older_count: 0}
  expected_correct:
    - {name: Alice, older_count: 2}
    - {name: Charlie, older_count: 1}
    - {name: Diana, older_count: 0}
reproduction: {attempts: 3, timeout_sec: 10}
provenance:
  query_id: RedisGraph__RedisGraph__2368__q001
  case_id: null
