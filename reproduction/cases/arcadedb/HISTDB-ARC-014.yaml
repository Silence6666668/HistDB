schema_version: 1
family_id: HISTDB-ARC-014
title: Consecutive directed pattern positions reuse the same relationship
paper_set: fixed-version-50
dbms: arcadedb
symptom: four rows are returned where relationship uniqueness permits only two
issue:
  url: https://github.com/ArcadeData/arcadedb/issues/4095
  status: confirmed
  report_path: issue_reports/submitted/arcadedb/2026-5-1/arcadedb_consecutive_directed_relationship_patterns_may_reuse_same_relationship.md
targets:
  buggy: {id: arcadedb-26.4.1}
  fixed: []
observation: {reported_version: 26.4.1-SNAPSHOT, execution_target: "arcadedata/arcadedb:26.4.1"}
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - "CREATE (:Person {name:'Alice'})<-[:KNOWS]-(:Person {name:'Bob'})-[:KNOWS]->(:Person {name:'Charlie'})"
  query: |-
    MATCH (s:Person)<-[:KNOWS]-(f:Person)-[:KNOWS]->(d:Person)
    RETURN s.name AS s, f.name AS f, d.name AS d
    ORDER BY s, f, d
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: exact_rows
  ordered: true
  expected_buggy:
    - {s: Alice, f: Bob, d: Alice}
    - {s: Alice, f: Bob, d: Charlie}
    - {s: Charlie, f: Bob, d: Alice}
    - {s: Charlie, f: Bob, d: Charlie}
  expected_correct:
    - {s: Alice, f: Bob, d: Charlie}
    - {s: Charlie, f: Bob, d: Alice}
