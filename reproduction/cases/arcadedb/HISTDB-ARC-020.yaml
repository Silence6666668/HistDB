  fixed: []
observation: {reported_version: 26.4.1-SNAPSHOT, execution_target: "arcadedata/arcadedb:26.4.1"}
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - |-
      CREATE (a:Person {name:'Alice'}),
             (b:Person {name:'Bob'}),
             (c:Person {name:'Charlie'}),
             (a)-[:KNOWS {since:2020}]->(b),
             (b)-[:KNOWS {since:2019}]->(c),
             (a)-[:KNOWS {since:2021}]->(c)
  query: "RETURN [(p:Person)-[r:KNOWS]->(q:Person) | q.name] AS xs"
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: scalar_equals
  field: xs
  expected_buggy: []
  expected_correct: [Bob, Charlie, Charlie]
