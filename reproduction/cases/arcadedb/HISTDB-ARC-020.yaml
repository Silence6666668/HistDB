  url: https://github.com/ArcadeData/arcadedb/issues/4106
  status: confirmed
  report_path: issue_reports/submitted/arcadedb/2026-5-1/arcadedb_pattern_comprehension_over_existing_relationships_may_evaluate_as_empty_list.md
