    id: falkordb-4.16.8
  fixed: []
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - "CREATE (:Person {name:'Alice', tags:['friend', 'colleague']})"
  query: |-
    MATCH (a:Person)
    WITH a
    WHERE all(item IN ['friend', 'colleague'] WHERE item IN a.tags)
    RETURN a.name AS name, a.tags AS tags
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: exact_rows
  ordered: false
  expected_buggy: []
  expected_correct:
