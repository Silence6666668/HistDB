schema_version: 1
family_id: HISTDB-MEM-004
title: Deprecated CALL write subquery nullifies an outer variable
paper_set: fixed-version-50
dbms: memgraph
symptom: an already-bound outer node becomes null after an implicit-import write subquery
issue:
  url: https://github.com/memgraph/memgraph/issues/4160
  status: confirmed
  report_path: issue_reports/submitted/memgraph/2026-5-17/memgraph_deprecated_call_write_subquery_may_nullify_outer_variable.md
targets:
  buggy:
    id: memgraph-3.9.0
  fixed: []
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - "CREATE (:Person {name:'Alice'}), (:Person {name:'Bob'})"
  query: |-
    MATCH (a:Person {name:'Alice'})
    MATCH (b:Person {name:'Bob'})
    WITH a, b
    CALL {
      CREATE (a)-[:LIKES]->(b)
    }
    RETURN a.name AS name
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: exact_rows
  ordered: false
  expected_buggy:
    - {name: null}
  expected_correct:
    - {name: Alice}
reproduction:
  attempts: 3
  timeout_sec: 10
