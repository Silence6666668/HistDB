schema_version: 1
family_id: HISTDB-MEM-005
title: Inline pattern-comprehension size filter loses correlation after WITH
paper_set: fixed-version-50
dbms: memgraph
symptom: unrelated rows survive an inline correlated size predicate
issue:
  url: https://github.com/memgraph/memgraph/issues/4161
  status: confirmed
  report_path: issue_reports/submitted/memgraph/2026-5-17/memgraph_inline_size_of_pattern_comprehension_filter_after_with_may_ignore_correlation.md
targets:
  buggy:
    id: memgraph-3.9.0
  fixed: []
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - "CREATE (:Person {name:'Alice'})-[:KNOWS]->(:Person {name:'Bob'})-[:KNOWS]->(:Person {name:'Charlie'})"
  query: |-
    MATCH (p:Person)-[:KNOWS]-(q:Person)
    WITH p
    WHERE size([(p)-[:KNOWS]-(r:Person) WHERE r.name STARTS WITH 'A' | r]) > 0
    RETURN DISTINCT p.name AS p
    ORDER BY p
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: exact_rows
  ordered: true
  expected_buggy:
    - {p: Alice}
    - {p: Bob}
    - {p: Charlie}
  expected_correct:
    - {p: Bob}
reproduction:
  attempts: 3
  timeout_sec: 10
