schema_version: 1
family_id: HISTDB-MEM-006
title: Label-only MERGE binding expands after a later same-label MERGE
paper_set: fixed-version-50
dbms: memgraph
symptom: a later same-label node is retroactively added to an earlier binding
issue:
  url: https://github.com/memgraph/memgraph/issues/4162
  status: confirmed
  report_path: issue_reports/submitted/memgraph/2026-5-17/memgraph_label_only_merge_binding_may_expand_after_later_same_label_merge.md
targets:
  buggy:
    id: memgraph-3.9.0
  fixed: []
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - "CREATE (:Person {name:'Alice'}), (:Person {name:'Bob'}), (:Person {name:'Charlie'})"
  query: |-
    MERGE (e:Person)
    MERGE (:Person {name:'Eve'})
    RETURN e.name AS eName
    ORDER BY eName
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: exact_rows
  ordered: true
  expected_buggy:
    - {eName: Alice}
    - {eName: Bob}
    - {eName: Charlie}
    - {eName: Eve}
  expected_correct:
    - {eName: Alice}
    - {eName: Bob}
    - {eName: Charlie}
reproduction:
  attempts: 3
  timeout_sec: 10
provenance:
  query_id: FalkorDB__FalkorDB__243__q003
  case_id: case_e82461f7927b
