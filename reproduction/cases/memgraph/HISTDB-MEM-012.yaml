schema_version: 1
family_id: HISTDB-MEM-012
title: Nested pattern comprehension duplicates inner matches
paper_set: fixed-version-50
dbms: memgraph
symptom: each one-edge inner match is counted twice inside an outer list comprehension
issue:
  url: https://github.com/memgraph/memgraph/issues/4099
  status: confirmed
  report_path: issue_reports/submitted/memgraph/2026-4-30/memgraph_nested_pattern_comprehension_inside_outer_list_comprehension_may_duplicate_matches.md
targets:
  buggy:
    id: memgraph-3.9.0
  fixed: []
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - |-
      CREATE (a:Person {name:'Alice'})-[:KNOWS]->(b:Person {name:'Bob'}),
             (a)-[:WORKS_AT]->(c:Company {name:'Acme'}),
             (b)-[:WORKS_AT]->(c)
  query: |-
    MATCH (a:Person {name:'Alice'})-[:KNOWS]->(b:Person {name:'Bob'})
    RETURN [n IN [a, b] | size([(n)-[:WORKS_AT]->(t) | t.name])] AS counts
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: scalar_equals
  field: counts
  expected_buggy: [2, 2]
  expected_correct: [1, 1]
reproduction:
  attempts: 3
  timeout_sec: 10
