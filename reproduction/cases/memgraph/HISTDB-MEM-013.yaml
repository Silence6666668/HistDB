schema_version: 1
family_id: HISTDB-MEM-013
title: Undirected relationship-type alternation double-counts rows
paper_set: fixed-version-50
dbms: memgraph
symptom: three distinct relationships produce six aggregate rows
issue:
  url: https://github.com/memgraph/memgraph/issues/4100
  status: confirmed
  report_path: issue_reports/submitted/memgraph/2026-4-30/memgraph_undirected_relationship_type_alternation_may_double_count_rows.md
targets:
  buggy:
    id: memgraph-3.9.0
  fixed: []
test:
  setup:
    - MATCH (n) DETACH DELETE n
    - |-
      CREATE (a:Node {name:'Alice'})-[:KNOWS]->(b:Node {name:'Bob'}),
             (a)-[:FRIEND]->(c:Node {name:'Charlie'}),
             (b)-[:KNOWS]->(c)
  query: |-
    MATCH ()-[r:KNOWS|FRIEND]-()
    RETURN count(*) AS cnt,
           size(collect(DISTINCT r)) AS distinct_cnt
  cleanup:
    - MATCH (n) DETACH DELETE n
oracle:
  type: exact_rows
  ordered: false
  expected_buggy:
    - {cnt: 6, distinct_cnt: 3}
  expected_correct:
    - {cnt: 3, distinct_cnt: 3}
reproduction:
  attempts: 3
  timeout_sec: 10
